services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://league:league@db:5432/sportsleague
      AUTH_SECRET: ${AUTH_SECRET:-please-change-me}
      AUTH_TRUST_HOST: "true"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: league
      POSTGRES_PASSWORD: league
      POSTGRES_DB: sportsleague
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U league"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
